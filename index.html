 if(c){const L=products.map((p,i)=>[p,i]).filter(([p])=>p.c===c);return `<section>${crumb([["Products","#/products"],[c]])}<h2>${c}</h2><div class="grid">${L.map(([p,i])=>pcard(p,i)).join("")}</div></section>`}
 return `<div class="band">List of products<small>Choose a category, then a product to see colors &amp; swatches</small></div><section><p class="lead">Tap a category to see its products, then a product to see its colors and swatches. Or search by name or color code (for example "8019", "ESD", "carpet").</p><input id="q" type="search" placeholder="Search products or color codes…" aria-label="Search products"><div class="grid" id="pg">${cats.map(catcard).join("")}</div></section>`},
